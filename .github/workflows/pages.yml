# main への push で、画面（dist/pages）を GitHub Pages に公開する
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node scripts/test.mjs
      - name: Check API_BASE
        run: test -n "${{ vars.API_BASE }}" || (echo "リポジトリ変数 API_BASE（Workers のURL）を設定してください" && exit 1)
      - name: Build
        run: node scripts/build.mjs
        env:
          API_BASE: ${{ vars.API_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
